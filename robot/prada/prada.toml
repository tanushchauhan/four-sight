# Bridge config for prada. Loopback only: the joystick relay runs on the Pi
# itself, and laptops reach the server through an SSH tunnel.
host = "127.0.0.1"
port = 8765
timeout = 0.5
deadzone = 0.15
# Every gait runs at speed 80 (the bridge allows up to the vendor maximum of 100).
min_speed = 80
max_speed = 80
poll_interval = 0.02
dry_gait_seconds = 0.15
